# The two custom search attributes Postiz indexes its workflows by.
#
# The application creates them itself on boot -- and, without Elasticsearch, fails
# doing it: it asks for them as Text, and PostgreSQL visibility has only three Text
# columns in its fixed schema. The backend then dies in its module-init hook, nginx
# answers /api/ with 502, and the frontend loads but can log nobody in.
#
# Creating them here first, as Keyword, sidesteps that: the application looks them up,
# finds both, and skips the call that would have failed. Keyword is the better type
# anyway -- these are ids matched exactly, not prose to search through.
#
# A hook rather than a plain Job so it runs on every sync and before the application
# rolls; it is idempotent, and "already exists" is success.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postiz.fullname" . }}-search-attributes
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "postiz.labels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create
          image: {{ .Values.temporal.image }}
          command:
            - sh
            - -c
            - |
              set -e
              until temporal operator cluster health >/dev/null 2>&1; do
                echo "waiting for temporal"; sleep 3
              done
              # Already there is the normal case on every sync after the first.
              temporal operator search-attribute create \
                --name organizationId --type Keyword \
                --name postId --type Keyword 2>&1 | tee /tmp/out
              grep -qiE "have been added|already exists" /tmp/out
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ include "postiz.fullname" . }}-temporal:7233"
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
